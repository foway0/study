services:
  go-grpc:
    build:
      context: ../
      dockerfile: build/go-grpc/Dockerfile
      target: development
    ports:
      - '8080:8080'
    volumes:
      - ../api:/go/src/app/api
      - ../cmd:/go/src/app/cmd
      - ../internal:/go/src/app/internal
    environment:
      - SERVICE_PORT=8080
      - MYSQL_HOST=my-mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=my_database
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    depends_on:
      - go-grpc-mysql

  go-grpc-mysql:
    image: mysql:9.3
    hostname: my-mysql
    ports:
      - '3306:3306'
    volumes:
      - ./docker/db/data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=my_database
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password

networks:
  default:
    name: my_network
    external: true