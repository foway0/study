services:
  go-grpc:
    build:
      context: ../
      dockerfile: build/go-grpc/Dockerfile
      target: development
    ports:
      - '8080:8080'
    volumes:
      - ../api:/go/src/app/api
      - ../cmd:/go/src/app/cmd
      - ../internal:/go/src/app/internal
    environment:
      - SERVICE_PORT=8080