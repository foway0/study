syntax = "proto3";
package api;
option go_package = "./;api";

import "google/protobuf/empty.proto";

service TodoService {
  rpc CreateTodo(CreateTodoRequest) returns (CreateTodoResponse);
  rpc ListTodos(ListTodosRequest) returns (ListTodosResponse);
  rpc GetTodoById(GetTodoByIdRequest) returns (GetTodoByIdResponse);
  rpc UpdateTodo(UpdateTodoRequest) returns (UpdateTodoResponse);
  rpc DeleteTodo(DeleteTodoRequest) returns (google.protobuf.Empty);
}

enum TodoStatus {
  todo = 0;  // [default]
  in_progress = 1;  // [optional]
  done = 2;  // [optional]
}

message Todo {
  uint64 id = 1; // [required] TodoのID
  uint64 user_id = 2; // [required] TodoのユーザーID
  string title = 3; // [required] Todoのタイトル
  string body = 4; // [optional] Todoの内容
  TodoStatus status = 5; // [optional] Todoの状態
  uint64 created_at = 6; // [required] Todoの作成日時
  uint64 updated_at = 7; // [required] Todoの更新日時
}

message CreateTodoRequest {
  string title = 1; // [required] Todoのタイトル
  string body = 2; // [optional] Todoの内容
}

message CreateTodoResponse {
  Todo todo = 1; // [required] 作成されたTodo
}

message ListTodosRequest {
  uint64 page = 1; // [optional] ページ番号
  uint64 size = 2; // [optional] 1ページあたりのTodoの数
}

message ListTodosResponse {
  repeated Todo todos = 1; // [required] Todoのリスト
}

message GetTodoByIdRequest {
  uint64 id = 1; // [required] TodoのID
}

message GetTodoByIdResponse {
  Todo todo = 1; // [required] Todo
}

message UpdateTodoRequest {
  uint64 id = 1; // [required] TodoのID
  string title = 2; // [required] Todoのタイトル
  string body = 3; // [optional] Todoの内容
  TodoStatus status = 4; // [optional] Todoの状態
}

message UpdateTodoResponse {
  Todo todo = 1; // [required] 更新されたTodo
}

message DeleteTodoRequest {
  uint64 id = 1; // [required] TodoのID
}
